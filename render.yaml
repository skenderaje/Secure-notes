# Render Blueprint: one free web service. The database is external (Neon Postgres).
# Secrets never live in this file: SECRET_KEY is generated by Render, DATABASE_URL is
# pasted in the Render dashboard (sync: false).
services:
  - type: web
    name: secure-notes
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # No --proxy-headers: X-Forwarded-For is client-controlled, see app/main.py login().
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
