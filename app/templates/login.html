{% extends "base.html" %}
{% block title %}Log in · SecureNotes{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if created %}<p class="alert ok">Account created. You can log in now.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required maxlength="32"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="/signup">Sign up</a></p>
</section>
{% endblock %}
