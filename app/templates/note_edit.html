{% extends "base.html" %}
{% block title %}Edit note · SecureNotes{% endblock %}
{% block content %}
<section class="card">
  <h1>Edit note</h1>
  <form method="post" action="/notes/{{ note.id }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Title <input name="title" value="{{ note.title }}" required maxlength="{{ title_max }}"></label>
    <label>Text <textarea name="body" rows="8" maxlength="{{ body_max }}">{{ note.body }}</textarea></label>
    <button type="submit">Save</button>
    <a href="/notes" class="muted">Cancel</a>
  </form>
</section>
{% endblock %}
